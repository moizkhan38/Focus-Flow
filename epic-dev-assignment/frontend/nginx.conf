# nginx config for the Focus Flow SPA.
#
# Two ways to run this:
#  (a) Same-origin (recommended, no CORS): build with VITE_API_URL="" so the app
#      calls relative /api and /socket.io — this server proxies them to the
#      backend. Set $backend below to the backend service/host.
#  (b) Split origin: build with VITE_API_URL=https://api.example.com so the app
#      calls the backend directly; then the /api and /socket.io blocks here are
#      unused (leave them — harmless — or delete them). You must set CORS_ORIGINS
#      on the backend in that case.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # In compose, "backend" resolves to the backend service on the internal
    # network. On a VPS behind this nginx, point it at 127.0.0.1:3003.
    set $backend "http://backend:3003";

    # Using a variable in proxy_pass (above) defers DNS to request time so a
    # backend restart with a new IP is picked up — but it REQUIRES a resolver.
    # 127.0.0.11 is Docker's embedded DNS (compose). Harmless when $backend is a
    # literal IP (VPS mode); change it if you run this nginx outside Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy (same-origin mode).
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI generation can take 60-120s — match the backend's tolerance.
        proxy_read_timeout 300s;
    }

    # Socket.IO (WebSocket upgrade).
    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SPA fallback: every other path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
